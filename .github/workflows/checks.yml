name: CHECKS · actualizar tablero y alertas

# Lee ASANA.tareas de BigQuery, recalcula hitos y alarmas, publica el tablero y
# manda al webhook las alertas NUEVAS (o resueltas). Los avisos de calidad de datos
# se reportan en un Issue y NO detienen la publicacion.
#
# Cuando corre:
#   - Lunes, miercoles y viernes a las 06:15 hora de Merida (12:15 UTC).
#     BigQuery se sincroniza con Asana por su lado; aqui solo se lee lo que ya esta.
#   - workflow_dispatch: a mano (con modo normal, todo o prueba).
on:
  schedule:
    - cron: '15 12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal = solo lo nuevo · todo = reenviar TODAS las alertas activas · prueba = un evento de prueba'
        type: choice
        options: [normal, todo, prueba]
        default: normal

permissions:
  contents: read
  issues: write

concurrency:
  group: checks-actualizar
  cancel-in-progress: false

env:
  GCP_PROJECT: bases-de-datos-sheets
  # Bucket propio de CHECKS. Se puede cambiar sin tocar codigo con la variable
  # de repo CHECKS_BUCKET (Settings -> Secrets and variables -> Actions -> Variables).
  BUCKET: ${{ vars.CHECKS_BUCKET || 'checks-orrisa' }}
  TZ: America/Merida

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Secreto GCP_SA_KEY = llave JSON de la cuenta de servicio de CHECKS
      # (checks-orrisa@bases-de-datos-sheets.iam.gserviceaccount.com).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Consultar tareas de Asana en BigQuery
        run: |
          bq --project_id="$GCP_PROJECT" --quiet query --use_legacy_sql=false \
             --format=json --max_rows=100000 < checks/consulta.sql > tareas.json
          echo "filas: $(node -e "console.log(require('./tareas.json').length)")"

      - name: Traer el estado de la corrida anterior
        run: |
          mkdir -p previo
          gcloud storage cp "gs://$BUCKET/checks-estado.json" previo/estado.json 2>/dev/null \
            || echo "sin estado previo: primera corrida"

      - name: Generar tablero y alertas
        run: node checks/checks_build.js tareas.json "$(date +%F)" salida | tee salida/log.txt

      - name: Publicar tablero
        run: |
          gcloud storage cp salida/checks.html salida/checks-datos.json "gs://$BUCKET/" \
            --cache-control="no-cache, max-age=0"
          echo "https://storage.googleapis.com/$BUCKET/checks.html" >> "$GITHUB_STEP_SUMMARY"

      # Va DESPUES de publicar y ANTES de guardar el estado: si el envio falla,
      # el estado no avanza y las alertas se reintentan en la siguiente corrida.
      - name: Enviar alertas al webhook
        id: enviar
        env:
          CHECKS_WEBHOOK_URL: ${{ secrets.CHECKS_WEBHOOK_URL }}
          TABLERO_URL: https://storage.googleapis.com/${{ vars.CHECKS_BUCKET || 'checks-orrisa' }}/checks.html
          MODO: ${{ inputs.modo || 'normal' }}
        run: node checks/checks_enviar.js salida/checks-alertas.json previo/estado.json salida/checks-datos.json

      - name: Guardar estado
        if: steps.enviar.outputs.avanzar == 'true'
        run: gcloud storage cp salida/checks-estado.json "gs://$BUCKET/checks-estado.json" --cache-control="no-cache, max-age=0"

      - name: Avisos de datos (Issue)
        if: always() && hashFiles('salida/checks-avisos.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node checks/avisos_md.js salida/checks-avisos.json > salida/avisos.md
          cat salida/avisos.md >> "$GITHUB_STEP_SUMMARY"
          total=$(node -e "console.log(require('./salida/checks-avisos.json').total)")
          gh label create checks-avisos --color F26B21 --description "CHECKS: datos que el mapeo no supo interpretar" --force >/dev/null 2>&1 || true
          n=$(gh issue list --state open --label checks-avisos --json number --jq '.[0].number // empty')
          if [ "$total" -gt 0 ]; then
            if [ -n "$n" ]; then gh issue edit "$n" --body-file salida/avisos.md
            else gh issue create --title "CHECKS: avisos de datos" --label checks-avisos --body-file salida/avisos.md; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Sin avisos en la última corrida."
          fi
